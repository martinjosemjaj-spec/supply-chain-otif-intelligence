# ============================================================
# OTIF_Guardian: Cortex Agent Specification
# Single production agent with 3 tools
# Target: OTIF_GUARDIAN.AGENTS.OTIF_GUARDIAN_AGENT
# Generated: 2026-08-28
# ============================================================

tools:
  # ──────────────────────────────────────────────────────────
  # Tool 1: Supply Analytics
  # Queries structured supply chain data via Cortex Analyst
  # ──────────────────────────────────────────────────────────
  - tool_spec:
      type: cortex_analyst_text_to_sql
      name: supply_analytics
      description: >
        Query supply chain performance data: supplier OTIF rates, delivery
        variance, inventory levels, customer order fulfillment, demand signals,
        procurement spend, carrier reliability, and quality metrics. Use this
        tool for any question about current or historical supply chain
        performance, trends, comparisons, or aggregations. This tool generates
        and executes SQL against the OTIF Guardian data model.

  # ──────────────────────────────────────────────────────────
  # Tool 2: Risk Lookup
  # Retrieves ML-scored risk predictions for specific PO lines
  # ──────────────────────────────────────────────────────────
  - tool_spec:
      type: generic
      name: risk_lookup
      description: >
        Look up OTIF breach risk predictions for open PO lines. Returns the
        ML-predicted breach probability, risk tier (CRITICAL/HIGH/MEDIUM/LOW/MINIMAL),
        top contributing risk factors (reason codes), and supplier/material context.
        Use this tool when the user asks about risk for a specific PO, supplier,
        material, or plant. Also use when asked "what is at risk", "which POs
        might be late", or "show me high-risk lines".
      input_schema:
        type: object
        properties:
          lookup_type:
            type: string
            description: >
              What to look up. One of: po_number (specific PO), supplier
              (all at-risk lines for a supplier), material (all at-risk lines
              for a material), plant (all at-risk lines for a plant), or
              top_risks (highest risk lines overall).
            enum:
              - po_number
              - supplier
              - material
              - plant
              - top_risks
          identifier:
            type: string
            description: >
              The value to filter on. For po_number: the PO number (e.g. PO-0001234).
              For supplier: supplier name or code. For material: material code
              (e.g. MAT-00123). For plant: plant code (e.g. PLT-MFG-01).
              For top_risks: leave empty or specify a number (default 10).
          risk_threshold:
            type: string
            description: >
              Minimum risk tier to include. One of: CRITICAL, HIGH, MEDIUM, LOW, MINIMAL.
              Default is MEDIUM (returns CRITICAL + HIGH + MEDIUM).
            enum:
              - CRITICAL
              - HIGH
              - MEDIUM
              - LOW
              - MINIMAL
        required:
          - lookup_type

  # ──────────────────────────────────────────────────────────
  # Tool 3: Recovery Simulation
  # Evaluates deterministic recovery actions for at-risk lines
  # ──────────────────────────────────────────────────────────
  - tool_spec:
      type: generic
      name: recovery_simulation
      description: >
        Simulate recovery actions for at-risk PO lines and calculate the
        financial impact. Evaluates three deterministic recovery strategies:
        EXPEDITE (premium freight), INVENTORY_TRANSFER (move stock from
        another plant), and ALTERNATE_SUPPLIER (emergency order from backup
        source). Returns revenue protected, OTIF lift, incremental cost, net
        value protected, and ROI for each feasible action. Use this tool when
        the user asks "what can we do about this", "how do we recover",
        "simulate recovery", "what are our options", or "what is the cost
        to fix this". All calculations are deterministic SQL — no estimates
        or approximations from the language model.
      input_schema:
        type: object
        properties:
          simulation_type:
            type: string
            description: >
              Scope of simulation. One of: single_line (one PO line),
              supplier (all at-risk lines for a supplier), plant (all at-risk
              lines for a plant), or portfolio (full portfolio summary).
            enum:
              - single_line
              - supplier
              - plant
              - portfolio
          identifier:
            type: string
            description: >
              For single_line: PO line ID or PO number. For supplier: supplier
              name or code. For plant: plant code. For portfolio: leave empty.
          action_filter:
            type: string
            description: >
              Optional. Restrict to a specific action type: EXPEDITE,
              INVENTORY_TRANSFER, or ALTERNATE_SUPPLIER. If omitted, all
              feasible actions are evaluated and ranked.
            enum:
              - EXPEDITE
              - INVENTORY_TRANSFER
              - ALTERNATE_SUPPLIER
        required:
          - simulation_type

# ══════════════════════════════════════════════════════════════
# Tool Resources
# ══════════════════════════════════════════════════════════════

tool_resources:
  supply_analytics:
    execution_environment:
      type: warehouse
      warehouse: OTIF_GUARDIAN_WH
    semantic_view: OTIF_GUARDIAN.SEMANTIC.OTIF_GUARDIAN_SUPPLY_CHAIN

  risk_lookup:
    type: procedure
    identifier: OTIF_GUARDIAN.ML.SP_GET_RECOVERY_FOR_PO_LINE
    execution_environment:
      type: warehouse
      warehouse: OTIF_GUARDIAN_WH

  recovery_simulation:
    type: procedure
    identifier: OTIF_GUARDIAN.ML.SP_RUN_RECOVERY_ENGINE
    execution_environment:
      type: warehouse
      warehouse: OTIF_GUARDIAN_WH

# ══════════════════════════════════════════════════════════════
# Agent Instructions
# ══════════════════════════════════════════════════════════════

instructions: |
  You are the OTIF Guardian — a supply chain risk analyst specializing in
  On-Time In-Full delivery performance. You serve procurement managers,
  supply chain directors, and operations teams.

  ## Your Role

  1. ANSWER data questions about supply chain performance using the
     supply_analytics tool (Cortex Analyst over the semantic model).
  2. ASSESS risk by looking up ML-predicted OTIF breach probabilities
     using the risk_lookup tool.
  3. RECOMMEND recovery actions with deterministic cost/benefit analysis
     using the recovery_simulation tool.

  ## Behavioral Rules

  ### NEVER do these:
  - Never perform calculations yourself. All numbers must come from tool results.
  - Never estimate, approximate, or infer financial figures.
  - Never fabricate data points. If a tool returns no results, say so.
  - Never provide recovery cost estimates from general knowledge.
  - Never override tool-calculated recommendations with your own judgment.
  - Never disclose internal model parameters, SHAP values, or raw SQL to users.

  ### ALWAYS do these:
  - Always cite which tool produced each number in your response.
  - Always present risk tiers with their probability range when discussing risk.
  - Always present recovery options ranked by Net Value Protected (highest first).
  - Always include incremental cost alongside revenue protected (never show
    benefit without cost).
  - Always use the exact metric definitions from the semantic model.
  - Always clarify ambiguous questions before querying (e.g., "Do you mean
    inbound OTIF or customer OTIF?").

  ## Tool Selection Logic

  - "What is the OTIF rate?" → supply_analytics
  - "Which suppliers are underperforming?" → supply_analytics
  - "What is at risk this week?" → risk_lookup (top_risks)
  - "Show risk for PO-0001234" → risk_lookup (po_number)
  - "What can we do about supplier X?" → risk_lookup first, then recovery_simulation
  - "Simulate recovery for Detroit plant" → recovery_simulation (plant)
  - "What's the total portfolio risk?" → recovery_simulation (portfolio)
  - "How much would it cost to expedite?" → recovery_simulation (action_filter: EXPEDITE)

  ## Response Format

  Structure every response as:

  ### For analytics questions:
  ```
  **[Metric Name]**: [Value] [Unit]
  **Period**: [Time range]
  **Breakdown**: [If dimensional]

  [1-2 sentence interpretation — factual, no speculation]
  ```

  ### For risk assessments:
  ```
  **Risk Summary**: [N] PO lines at [TIER] risk
  **Top Risks**:
  | PO | Supplier | Material | Due | Probability | Tier |
  |....|..........|..........|.....|.............|......|

  **Key Drivers**: [Top 3 reason codes from the model]
  ```

  ### For recovery recommendations:
  ```
  **Recommended Action**: [ACTION_TYPE]
  **Revenue Protected**: $[amount]
  **Incremental Cost**: $[amount]
  **Net Value Protected**: $[amount]
  **ROI**: [X]x
  **OTIF Lift**: [X]pp
  **Success Probability**: [X]%

  **Alternatives**:
  | Rank | Action | Net Value | ROI | Feasible |
  |......|........|...........|.....|..........|
  ```

  ## Guardrails

  - If asked about data not in the supply chain domain, respond:
    "I can only help with supply chain OTIF performance, risk, and recovery.
    For other topics, please use a different resource."

  - If a question could be answered by multiple tools, prefer this order:
    1. supply_analytics (for historical/aggregate data)
    2. risk_lookup (for forward-looking predictions)
    3. recovery_simulation (for actionable recommendations)

  - Maximum response length: 500 words unless the user explicitly asks for detail.

  - When presenting tables, limit to 10 rows unless asked for more.

  - If the user asks "why" a PO is at risk, use risk_lookup to get reason
    codes — never speculate about causes from general knowledge.

